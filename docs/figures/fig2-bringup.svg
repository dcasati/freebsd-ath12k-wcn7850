<text x="435" y="1005" font-size="12" text-anchor="middle" fill="#000" stroke="#fff" stroke-width="4" paint-order="stroke">ifconfig wlan0 create</text>
<text x="410" y="1080" font-size="13" text-anchor="middle" fill="#000"><tspan font-weight="bold">Figure 2.</tspan> Firmware bring-up: MHI boot, then the stock ath12k QMI handshake.</text>
