<text x="435" y="822" font-size="12.5" text-anchor="middle" fill="#000" stroke="#fff" stroke-width="5" paint-order="stroke">WLAN mode and config</text>
<line x1="20" y1="872" x2="800" y2="872" stroke="#000" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="20" y="888" font-size="13" font-style="italic" fill="#000">HTC/WMI over copy engines</text>
<line x1="720" y1="920" x2="152" y2="920" stroke="#000" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 3"/>
