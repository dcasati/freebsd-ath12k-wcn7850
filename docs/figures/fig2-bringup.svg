<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1098" viewBox="0 0 820 1098" font-family="Times New Roman, Times, Liberation Serif, serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000"/></marker>
