<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="Times New Roman, Times, Liberation Serif, serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#000"/>
    </marker>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bbb" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="760" height="640" fill="#fff"/>
  <g stroke="#000" stroke-width="1.2" fill="#fff">

    <!-- user space -->
    <text x="20" y="34" stroke="none" fill="#000" font-style="italic">user</text>
    <rect x="110" y="16" width="160" height="40"/>
    <rect x="300" y="16" width="160" height="40"/>
    <rect x="490" y="16" width="160" height="40"/>
    <line x1="20" y1="76" x2="740" y2="76" stroke-dasharray="6 4"/>
    <text x="20" y="96" stroke="none" fill="#000" font-style="italic">kernel</text>

    <!-- net80211 -->
    <rect x="110" y="104" width="540" height="58"/>
    <rect x="470" y="118" width="166" height="32" fill="url(#h)"/>

    <!-- LinuxKPI 802.11 -->
    <rect x="110" y="196" width="540" height="78"/>
    <rect x="124" y="228" width="160" height="34" fill="url(#h)"/>
    <rect x="300" y="228" width="160" height="34" fill="url(#h)"/>
    <rect x="476" y="228" width="160" height="34"/>

    <!-- ath12k -->
    <rect x="110" y="308" width="540" height="92"/>
    <rect x="124" y="340" width="96" height="46"/>
    <rect x="230" y="340" width="96" height="46" fill="url(#h)"/>
    <rect x="336" y="340" width="96" height="46"/>
    <rect x="442" y="340" width="96" height="46"/>
    <rect x="548" y="340" width="88" height="46"/>

    <!-- LinuxKPI bus services -->
    <rect x="110" y="434" width="540" height="74"/>
    <rect x="124" y="462" width="150" height="34" fill="url(#h)"/>
    <rect x="290" y="462" width="170" height="34" fill="url(#h)"/>
    <rect x="476" y="462" width="160" height="34"/>

    <!-- hardware -->
    <line x1="20" y1="528" x2="740" y2="528" stroke-dasharray="6 4"/>
    <text x="20" y="548" stroke="none" fill="#000" font-style="italic">hardware</text>
    <rect x="110" y="540" width="540" height="44"/>
  </g>

  <!-- arrows -->
  <g stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="190" y1="56" x2="190" y2="102"/>
    <line x1="380" y1="56" x2="380" y2="102"/>
    <line x1="570" y1="102" x2="570" y2="58"/>
    <line x1="380" y1="162" x2="380" y2="194"/>
    <line x1="380" y1="274" x2="380" y2="306"/>
    <!-- QMI path -->
    <line x1="384" y1="386" x2="384" y2="460"/>
    <line x1="290" y1="479" x2="276" y2="479"/>
    <line x1="199" y1="496" x2="199" y2="538"/>
    <line x1="538" y1="363" x2="546" y2="363"/>
    <line x1="592" y1="386" x2="592" y2="460"/>
    <line x1="592" y1="496" x2="592" y2="538"/>
  </g>

  <!-- labels -->
  <g fill="#000" text-anchor="middle">
    <text x="190" y="41">wpa_supplicant(8)</text>
    <text x="380" y="41">ifconfig(8)</text>
    <text x="570" y="41">dhclient(8)</text>
    <text x="578" y="94" font-size="11" font-style="italic" text-anchor="start">link UP</text>
    <text x="236" y="94" font-size="11" font-style="italic">ioctl / EAPOL</text>

    <text x="290" y="128" font-weight="bold">net80211</text>
    <text x="290" y="146" font-size="12">ieee80211(9) state machine, crypto, scan</text>
    <text x="553" y="139" font-size="12">iv_port_authorize</text>

    <text x="380" y="216" font-weight="bold">LinuxKPI 802.11</text>
        <text x="204" y="250" font-size="12">controlled port</text>
    <text x="380" y="250" font-size="12">strict regulatory</text>
    <text x="556" y="250" font-size="12">mac80211 / cfg80211</text>

    <text x="380" y="328" font-weight="bold">ath12k</text>
        <text x="172" y="360" font-size="12">mac.c</text>
    <text x="172" y="376" font-size="11" font-style="italic">ieee80211_ops</text>
    <text x="278" y="360" font-size="12">dp.c</text>
    <text x="278" y="376" font-size="11" font-style="italic">DMA ownership</text>
    <text x="384" y="360" font-size="12">qmi.c</text>
    <text x="384" y="376" font-size="11" font-style="italic">stock path</text>
    <text x="490" y="360" font-size="12">wmi.c / htc.c</text>
    <text x="490" y="376" font-size="11" font-style="italic">control</text>
    <text x="592" y="360" font-size="12">pci.c / ce.c</text>
    <text x="592" y="376" font-size="11" font-style="italic">copy engines</text>

    <text x="124" y="452" font-weight="bold" text-anchor="start">LinuxKPI bus services</text>
    <text x="199" y="484" font-size="12">MHI host (BHI/BHIe)</text>
    <text x="375" y="484" font-size="12">QMI + QRTR endpoint</text>
    <text x="556" y="484" font-size="12">PCI, DMA, firmware(9)</text>

    <text x="380" y="560" font-weight="bold">Qualcomm WCN7850 (PCIe)</text>
    <text x="380" y="576" font-size="12">firmware: /boot/firmware/ath12k/WCN7850/hw2.0/</text>
  </g>
  <g fill="#000" font-size="11" font-style="italic">
    <text x="390" y="424">QMI messages</text>
    <text x="598" y="424">WMI, data rings</text>
    <text x="206" y="522">firmware boot, IPCR channels</text>
    <text x="598" y="522">PCIe BAR, DMA</text>
  </g>

  <!-- legend -->
  <rect x="110" y="598" width="24" height="14" fill="url(#h)" stroke="#000" stroke-width="1"/>
  <text x="142" y="610" font-size="12" fill="#000">added or substantially changed by this work</text>
  <text x="380" y="632" font-size="13" fill="#000" text-anchor="middle"><tspan font-weight="bold">Figure 1.</tspan> Software layers for WCN7850 station mode on FreeBSD.</text>
</svg>
